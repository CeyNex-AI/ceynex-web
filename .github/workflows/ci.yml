# ceynex-web CI: lint, the vitest suite, and the production build.
#
# The Playwright suite in e2e/ is deliberately not here: it drives the
# production bundle against a running ceynex-core API over a loaded stack (see
# e2e/README.md), which a runner does not have.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Node 22 matches ceynex-infra/frontend/Dockerfile's build stage, not an
      # arbitrary CI default -- a lint/build pass here should mean the deployed
      # image builds too.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # `tsc -b && vite build` -- type errors fail the build the same way they
      # would fail `ceynex-infra/frontend/Dockerfile`'s build stage.
      - run: npm run build

  # Dependency-vulnerability and secrets scanning. eslint-plugin-security
  # carries the TypeScript SAST inside the lint job above (--max-warnings 0);
  # this job adds the two checks that are not lint rules. Kept in ci.yml rather
  # than a separate workflow to match this repo's single-workflow layout.
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Fails the job on a known advisory of high severity or worse. Moderate
      # and below are reported but not gated, so a transitive low does not block
      # a PR; raise the bar here if the team wants it stricter.
      - run: npm audit --audit-level=high
      # gitleaks CLI directly, not gitleaks-action@v2: that action requires a
      # paid GITLEAKS_LICENSE for a GitHub organization, while the binary is
      # MIT-licensed and free. Pinned so a new release cannot turn a PR red.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: Scan git history for secrets
        run: gitleaks detect --source . --redact --verbose
