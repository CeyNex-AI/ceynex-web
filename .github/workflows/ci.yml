# ceynex-web CI: lint, the vitest suite, and the production build.
#
# The Playwright suite in e2e/ is deliberately not here: it drives the
# production bundle against a running ceynex-core API over a loaded stack (see
# e2e/README.md), which a runner does not have.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Node 22 matches ceynex-infra/frontend/Dockerfile's build stage, not an
      # arbitrary CI default -- a lint/build pass here should mean the deployed
      # image builds too.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # `tsc -b && vite build` -- type errors fail the build the same way they
      # would fail `ceynex-infra/frontend/Dockerfile`'s build stage.
      - run: npm run build
